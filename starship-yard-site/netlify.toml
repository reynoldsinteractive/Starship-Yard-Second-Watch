# Starship Yard + Second Watch. No build step: Netlify publishes the public/ folder,
# and the sign-in gate in netlify/edge-functions/gate.js checks every request first.
[build]
  publish = "public"
  edge_functions = "netlify/edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
