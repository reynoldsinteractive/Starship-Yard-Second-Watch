<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>Second Watch banner</title>

</head>
<body>


<link href="../fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff9c3a}a:hover{color:#ffb86b}
</style>

<div style="width: 1500px; height: 500px; box-sizing: border-box; position: relative; overflow: hidden; background: #05070c; color: #e6eaf1; font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 64px 80px; display: flex; align-items: center; gap: 48px">
<svg aria-hidden="true" width="1500" height="500" style="position: absolute; left: 0px; top: 0px">
<defs><pattern id="s4" width="210" height="160" patternUnits="userSpaceOnUse"><circle cx="20" cy="30" r="1.2" fill="#ffffff"></circle><circle cx="130" cy="110" r="0.9" fill="#cdd8ff"></circle><circle cx="180" cy="40" r="1.4" fill="#ffffff" opacity="0.6"></circle></pattern></defs>
<rect width="1500" height="500" fill="url(#s4)" opacity="0.6"></rect>
<rect x="0" y="468" width="1500" height="32" fill="#ff9c3a"></rect>
<rect x="1180" y="468" width="160" height="32" fill="#6fb7ff"></rect>
</svg>
<div style="position: relative; flex: 1 1 0px; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; color: #6fb7ff">Starship Yard · tabletop</span>
<h1 style="margin: 0px; font-family: Antonio, 'Arial Narrow', sans-serif; font-weight: 700; font-size: 124px; line-height: 0.88; text-transform: uppercase; letter-spacing: 0.02em">Second <span style="color: #ff9c3a">Watch</span></h1>
<p style="margin: 0px; font-size: 28px; color: #c8d0dc">The ships the shows never followed. Design one. Captain it.</p>
</div>

<polygon points="150,130 180,130 150,52 128,52"></polygon>
<rect x="18" y="34" width="262" height="20" rx="10"></rect>
<polygon points="352,86 398,86 330,140 290,140"></polygon>
<ellipse cx="226" cy="152" rx="146" ry="27"></ellipse>
<ellipse cx="432" cy="72" rx="162" ry="23"></ellipse>
<ellipse cx="432" cy="49" rx="30" ry="9"></ellipse>
</g>
<circle cx="272" cy="44" r="8" fill="#ff5d3a"></circle>
<circle cx="364" cy="153" r="11" fill="#ff9c3a"></circle>
