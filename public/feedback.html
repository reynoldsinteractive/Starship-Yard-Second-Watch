<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Drydock · Feedback</title><link href="fonts/fonts.css" rel="stylesheet"><style>
:root{--ink:#14181f;--muted:#5b6575;--accent:#c2621a;--line:#d9dde3}
*{box-sizing:border-box} body{margin:0;background:#f6f5f2;color:var(--ink);font:16px/1.6 'IBM Plex Sans',system-ui,sans-serif}
nav.top{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 20px;background:#0b0f16;font:500 13px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
nav.top a{color:#e6eaf1;text-decoration:none} nav.top a:first-child{color:#ff9c3a;font-weight:700} nav.top button{margin-left:auto;background:#ff9c3a;color:#120c05;border:0;border-radius:999px;padding:7px 14px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:36px 22px 80px;background:#fff;min-height:100vh}
h1{font:700 46px/1 Antonio,'Arial Narrow',sans-serif;text-transform:uppercase;margin:0 0 10px} h2{font:700 28px/1.1 Antonio,sans-serif;text-transform:uppercase;margin:40px 0 10px;padding-top:12px;border-top:3px solid var(--accent)} h3{font:700 20px Antonio,sans-serif;text-transform:uppercase;margin:24px 0 6px}
p em:only-child{color:var(--muted)} a{color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;display:block;overflow-x:auto} th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top} th{background:#f0eee9;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
blockquote{margin:12px 0;padding:12px 16px;border-left:4px solid var(--accent);background:#fbf4ec}
li{margin:3px 0}
@media print{ nav.top{display:none} body{background:#fff;font-size:11pt} main{padding:0;max-width:none} h2{break-after:avoid} table,blockquote{break-inside:avoid} table{display:table} a{color:inherit;text-decoration:none} }
</style></head><body><nav class="top"><a href="index.html">Drydock</a><a href="book.html">Book</a><a href="library.html">Library</a><a href="rules.html">Rules</a><a href="quick-start.html">Quick-start</a><a href="feedback.html">Feedback</a><button onclick="print()">Print or save as PDF</button><a href="/login">Crew access</a></nav><main><h1>Feedback</h1><p>Tried Drydock or Second Watch? Tell us what worked, what didn't, and which game you'd like to take your ships into. Every field is optional except the message.</p>
<form name="feedback" method="POST" action="/feedback-thanks.html" data-netlify="true" netlify-honeypot="company" class="fb">
<input type="hidden" name="form-name" value="feedback"><p class="hp"><label>Leave this empty <input name="company"></label></p>
<label>Your name or handle<input name="name" autocomplete="nickname"></label>
<label>Email, if you'd like a reply<input name="email" type="email" autocomplete="email"></label>
<label>Which game do you play?<select name="system"><option value="">Choose one</option><option>Second Watch</option><option>Cepheus Engine / Traveller-style 2D6</option><option>Starfinder</option><option>Stars Without Number</option><option>Mothership</option><option>Coriolis / Year Zero Engine</option><option>OpenD6 / Mini Six</option><option>Full Thrust or another fleet wargame</option><option>Other (tell us below)</option><option>I just like building ships</option></select></label>
<label>For an export to your game: which numbers would you need on the card?<textarea name="numbers" rows="3" placeholder="For example: hull points, thrust, armor, weapon mounts, cargo"></textarea></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<label class="chk"><input type="checkbox" name="printed" value="yes"> I printed a ship in 3D</label>
<button type="submit">Send feedback</button></form>
<style>.fb{display:flex;flex-direction:column;gap:14px;max-width:560px}.fb label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}.fb .chk{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.fb input,.fb select,.fb textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:8px}.fb button{align-self:flex-start;background:#ff9c3a;color:#120c05;border:0;border-radius:999px;padding:11px 22px;font:600 15px 'IBM Plex Sans',sans-serif;cursor:pointer}.hp{display:none}</style></main></body></html>
